<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OBS LIVE STREAM OVERLAY PREVIEW</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    #template-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <iframe id="template-frame" allow="autoplay; cross-origin-isolated" allowtransparency="true"></iframe>

  <!-- Background Music Player for OBS Preview Stream -->
  <audio id="bgm-audio" preload="auto"></audio>
  <div id="yt-container" style="position: fixed; width: 1px; height: 1px; left: -9999px; bottom: 0; opacity: 0; pointer-events: none; overflow: hidden;">
    <iframe id="yt-bgm-frame" allow="autoplay" style="width: 200px; height: 200px;"></iframe>
  </div>

  <script>
    const frame = document.getElementById('template-frame');
    const bgmAudio = document.getElementById('bgm-audio');
    const ytBgmFrame = document.getElementById('yt-bgm-frame');
    const params = new URLSearchParams(location.search);
    const streamKey = params.get('key') || 'live_default';
    let currentTemplateId = '';
    let currentYtId = '';
    let currentMusicState = null;

    // Control YouTube iframe via postMessage
    function sendYtCommand(func, args) {
      if (!ytBgmFrame || !ytBgmFrame.contentWindow) return;
      ytBgmFrame.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: func,
        args: args || []
      }), '*');
    }

    function applyMusicState(music) {
      if (!music) return;
      currentMusicState = music;

      const isPlaying = !!music.isPlaying;
      const vol = typeof music.volume === 'number' ? music.volume : 70;
      const isLoop = music.isLoop !== false;

      if (music.sourceType === 'youtube' && music.youtubeId) {
        // Pause local audio
        if (bgmAudio) {
          bgmAudio.pause();
          bgmAudio.src = '';
        }

        if (currentYtId !== music.youtubeId) {
          currentYtId = music.youtubeId;
          ytBgmFrame.src = `https://www.youtube.com/embed/${music.youtubeId}?enablejsapi=1&autoplay=1&loop=1&playlist=${music.youtubeId}&origin=${encodeURIComponent(location.origin)}`;
        }

        setTimeout(() => {
          sendYtCommand('setVolume', [vol]);
          if (isPlaying) {
            sendYtCommand('playVideo');
          } else {
            sendYtCommand('pauseVideo');
          }
        }, 500);

      } else if (music.sourceType === 'mp3' || music.sourceType === 'local') {
        // Stop YouTube
        if (currentYtId) {
          sendYtCommand('pauseVideo');
          ytBgmFrame.src = 'about:blank';
          currentYtId = '';
        }

        if (music.url) {
          const targetUrl = new URL(music.url, location.origin).href;
          if (bgmAudio.src !== targetUrl) {
            bgmAudio.src = targetUrl;
          }
          bgmAudio.volume = vol / 100;
          bgmAudio.loop = isLoop && (!music.playlist || music.playlist.length <= 1);

          if (isPlaying) {
            bgmAudio.play().catch(e => console.log('BGM Autoplay notice:', e.message));
          } else {
            bgmAudio.pause();
          }
        } else {
          bgmAudio.pause();
        }
      } else {
        // Stop all
        if (bgmAudio) bgmAudio.pause();
        if (currentYtId) sendYtCommand('pauseVideo');
      }
    }

    // Auto next track in playlist when track ends
    bgmAudio.addEventListener('ended', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'MUSIC_NEXT', key: streamKey }));
      }
    });

    function setTemplateUrl(entryUrl) {
      const url = new URL(entryUrl, location.origin);
      url.searchParams.set('key', streamKey);
      url.searchParams.set('_t', Date.now()); // Prevent caching
      if (frame.src !== url.href) {
        frame.src = url.href;
      }
    }

    // Connect to WebSocket to track template changes in real-time
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + location.host + '/ws?key=' + encodeURIComponent(streamKey);
    let ws = null;

    function connect() {
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        setTimeout(connect, 2000);
        return;
      }

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'SUBSCRIBE', key: streamKey }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'INIT_STATE') {
            const entryUrl = msg.entryUrl || (msg.templateId === 'lucky_wheel'
              ? '/templates/lucky-wheel/index.html'
              : msg.templateId === 'photo_wall'
              ? '/templates/photo-wall/index.html'
              : '/templates/print-booth-3d/index.html');
            setTemplateUrl(entryUrl);
            currentTemplateId = msg.templateId || 'print_booth_3d';
          } else if (msg.type === 'CHANGE_TEMPLATE') {
            if (msg.entryUrl) {
              setTemplateUrl(msg.entryUrl);
              currentTemplateId = msg.templateId;
            }
          } else if (msg.type === 'SET_MUSIC') {
            applyMusicState(msg.music);
          }
        } catch (err) {}
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e) {}
      };
    }

    connect();
  </script>
</body>
</html>
